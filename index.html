<!DOCTYPE html>
<html>
<head>
    <title>Для Тебя ❤️</title>

    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
            padding-top: 150px;
            font-family: Arial;
        }

        h1 {
            color: pink;
        }

        button {
            background: none;
            border: none;
            font-size: 80px;
            cursor: pointer;
        }

        #message {
            display: none;
            color: pink;
            font-size: 24px;
            margin-top: 30px;
        }
</style>
</head>

<body>

    <h1>Для тебя ❤️</h1>

    <button onclick="showMessage()">❤️</button>

    <p id="message">
        Ты — моё самое красивое вдохновение. ❤️
    </p>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
